<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mission Planner">
<meta name="theme-color" content="#090D14">
<title>Mission Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090D14;--panel:#0F151F;--panel2:#141C28;--line:#1E2A3B;--line2:#2B3B52;
  --text:#DDE6F1;--dim:#8292A8;--mute:#4B5B71;
  --or:#FF6A1F;--cy:#47D3E8;--gr:#3BDB8C;--am:#FFB224;--rd:#FF5252;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Noto Sans KR',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{min-height:100vh;color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom)}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse 90% 45% at 50% -8%,rgba(71,211,232,.10),transparent 65%),
  radial-gradient(ellipse 60% 40% at 100% 110%,rgba(255,106,31,.06),transparent 70%),
  linear-gradient(rgba(71,211,232,.035) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,rgba(71,211,232,.035) 1px,transparent 1px) 0 0/32px 32px,var(--bg)}
button{font-family:inherit;cursor:pointer;color:inherit;background:none;border:0}
input,textarea{font-family:inherit}
.mono{font-family:var(--mono)}
.dim{color:var(--dim)} .sm{font-size:11px} .gr{color:var(--gr)} .rd{color:var(--rd)} .or{color:var(--or)}
.sp{flex:1}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

.hdr{position:sticky;top:0;z-index:20;background:rgba(9,13,20,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hin{max-width:720px;margin:0 auto;padding:12px 16px 8px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.ttl{font-family:var(--mono);font-weight:600;font-size:17px;letter-spacing:.06em}
.ttl em{font-style:normal;color:var(--or)}
.clk{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:2px}
#clk{font-family:var(--mono);font-size:12px;color:var(--cy);font-variant-numeric:tabular-nums}
.tabs{max-width:720px;margin:0 auto;display:flex;padding:0 16px}
.tab{flex:1;padding:10px 0 9px;font-size:13px;color:var(--dim);border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.tab span{font-family:var(--mono);font-size:10px;letter-spacing:.16em;margin-right:6px;opacity:.8}
.tab.on{color:var(--text);border-bottom-color:var(--or)}

.wrap{max-width:720px;margin:0 auto;padding:18px 16px 64px}
.wrap>*{animation:rise .35s ease both}
.wrap>*:nth-child(2){animation-delay:.04s}.wrap>*:nth-child(3){animation-delay:.08s}.wrap>*:nth-child(4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.pnl{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:14px}
.pnl::before,.pnl::after{content:'';position:absolute;width:10px;height:10px;border:1.5px solid var(--cy);opacity:.55;pointer-events:none}
.pnl::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.pnl::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
h1,h2,h3{font-weight:600;letter-spacing:-.01em}
h2{font-size:17px;margin-top:2px}

.btn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;padding:9px 14px;border:1px solid var(--line2);border-radius:3px;color:var(--text);white-space:nowrap;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--cy)}
.btn.pri{background:var(--or);border-color:var(--or);color:#160900;font-weight:600}
.btn.pri:hover{background:#FF7F3D}
.btn.sm{padding:6px 10px;font-size:10.5px}
.btn.dng{color:var(--rd);border-color:rgba(255,82,82,.35)}
.btn.ghost{border-color:transparent;padding-left:0;color:var(--dim)}
.btn.full{width:100%;padding:13px;font-size:12px}
button:active{transform:scale(.97)}

.tele4,.tgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:18px}
.tele4>div,.tgrid>div{background:var(--panel);padding:12px}
.tgrid{margin:16px 0 14px}
.big{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:4px}
.big small{font-size:13px;color:var(--dim);margin-left:2px}
.cap{font-size:11px;color:var(--mute);margin-top:2px}
@media(max-width:500px){.tele4,.tgrid{grid-template-columns:repeat(2,1fr)}.big{font-size:22px}}

.sechd{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:22px 0 12px}
.navrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}

.mc{cursor:pointer;transition:border-color .2s,transform .2s}
.mc:hover{border-color:var(--line2);transform:translateY(-1px)}
.mc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.code{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--or)}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.12em;padding:3px 7px;border:1px solid currentColor;border-radius:2px;display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:400;font-family:var(--sans);letter-spacing:0;opacity:.85}
.mc-name{font-size:17px;margin:8px 0 4px}
.bars{display:flex;flex-direction:column;gap:7px;margin-top:12px}
.br{display:flex;align-items:center;gap:10px}
.br .lbl{width:44px}
.br .mono{width:38px;text-align:right;color:var(--dim)}
.bar{flex:1;height:6px;background:#18212F;position:relative;overflow:hidden;border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;transition:width .6s cubic-bezier(.4,0,.2,1)}
.bar.sch i{background:var(--cy);opacity:.7}
.bar.prg i{background:repeating-linear-gradient(-45deg,var(--or) 0 4px,#D9551A 4px 8px)}
.mc-foot{display:flex;align-items:baseline;gap:8px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.tv{font-family:var(--mono);font-size:18px;font-weight:600;color:var(--or)}
.arr{font-size:18px;color:var(--mute);margin-left:4px}

.empty{text-align:center;padding:40px 20px}
.empty .ic{font-family:var(--mono);color:var(--cy);font-size:12px;letter-spacing:.2em;margin-bottom:10px}
.empty p{color:var(--dim);margin-bottom:16px}

.bk{display:flex;align-items:center;gap:8px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.bk .lbl{margin-right:auto}

.hero-name{font-size:22px;margin:8px 0 4px}
.desc{color:var(--dim);font-size:13px;white-space:pre-wrap}
.big.or{color:var(--or)}

.phd{display:flex;justify-content:space-between;align-items:flex-end}
.tl{position:relative;height:66px;margin:10px 10px 0}
.tl .track{position:absolute;left:0;right:0;top:30px;height:2px;background:var(--line2)}
.tl .elapsed{position:absolute;left:0;top:30px;height:2px;background:var(--cy);box-shadow:0 0 10px var(--cy)}
.tick{position:absolute;top:24px;width:1px;height:14px;background:var(--line2)}
.tick span{position:absolute;top:18px;left:0;transform:translateX(-50%);font:9px var(--mono);color:var(--mute);white-space:nowrap}
.tick.first span{transform:none}
.mk{position:absolute;top:26px;width:10px;height:10px;margin-left:-5px;transform:rotate(45deg);background:var(--or);border:1.5px solid var(--bg)}
.mk.done{background:var(--gr)} .mk.late{background:var(--rd)}
.now{position:absolute;top:4px;height:44px;border-left:1px dashed var(--or)}
.now span{position:absolute;top:-2px;left:5px;font:9px var(--mono);color:var(--or);letter-spacing:.14em}
.now.r span{left:auto;right:5px}
.tlends{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:2px}
.legend{display:flex;gap:14px;font-size:10px;color:var(--mute);margin-top:10px}
.lg{display:inline-block;width:7px;height:7px;transform:rotate(45deg);margin-right:6px}
.lg.o{background:var(--or)}.lg.g{background:var(--gr)}.lg.r{background:var(--rd)}

.seg-ctrl{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg-ctrl .lbl{margin-right:8px}
.seg-b{font-family:var(--mono);font-size:11px;padding:6px 12px;border:1px solid var(--line2);border-radius:2px;color:var(--dim)}
.seg-b.on{border-color:var(--cy);color:var(--cy);background:rgba(71,211,232,.08)}

.segs{margin-top:16px}
.seg{position:relative;border-left:2px solid var(--line2);padding:0 0 20px 16px;margin-left:6px}
.seg:last-child{border-left-color:transparent}
.seg::before{content:'';position:absolute;left:-7px;top:2px;width:12px;height:12px;border:2px solid var(--line2);background:var(--bg);border-radius:50%}
.seg.past::before{background:var(--line2)}
.seg.cur{border-left-color:var(--or)}
.seg.cur::before{border-color:var(--or);background:var(--or);box-shadow:0 0 0 5px rgba(255,106,31,.16)}
.seghd{display:flex;align-items:center;gap:10px;min-height:18px}
.segid{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.08em}
.seg.cur .segid{color:var(--or)}
.nowtag{font:10px var(--mono);letter-spacing:.14em;color:var(--or)}
.add{width:26px;height:26px;border:1px dashed var(--line2);border-radius:2px;color:var(--dim);font-size:15px;line-height:1}
.add:hover{border-color:var(--or);color:var(--or)}
.emptyseg{font-size:12px;color:var(--mute);margin-top:6px}

.task{margin-top:8px;background:var(--panel);border:1px solid var(--line);border-radius:3px;transition:border-color .2s}
.task.late{border-color:rgba(255,82,82,.35)}
.task.done .tt{text-decoration:line-through;color:var(--dim)}
.trow{display:flex;gap:12px;align-items:flex-start;padding:12px}
.chk{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:2px;color:#06140C;font-size:12px;font-weight:700;flex-shrink:0;display:grid;place-items:center;margin-top:1px;transition:all .15s}
.chk.on{background:var(--gr);border-color:var(--gr)}
.chk.part{border-color:var(--am);background:linear-gradient(135deg,transparent 45%,var(--am) 45% 55%,transparent 55%)}
.chk.s{width:17px;height:17px;font-size:10px}
.tb{flex:1;min-width:0;cursor:pointer}
.tt{font-weight:500;word-break:keep-all;overflow-wrap:anywhere}
.tm{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:10.5px;color:var(--dim);margin-top:4px;letter-spacing:.04em}
.tm b{font-weight:500}
.pri{padding:0 5px;border:1px solid currentColor;border-radius:2px}
.pH{color:var(--rd)}.pM{color:var(--am)}.pL{color:var(--dim)}
.mini{height:3px;background:#18212F;margin-top:8px;position:relative}
.mini i{position:absolute;left:0;top:0;bottom:0;background:var(--gr)}
.exp{color:var(--mute);font-size:13px;width:24px;height:24px;transition:transform .2s}
.exp.on{transform:rotate(180deg);color:var(--cy)}
.tag{font-size:10.5px;color:var(--or);letter-spacing:.06em;margin-bottom:3px;cursor:pointer}
.subs{border-top:1px dashed var(--line);padding:10px 12px 12px 44px}
.sub{display:flex;align-items:center;gap:10px;padding:6px 0}
.sn{font-size:10px;color:var(--mute);width:16px}
.stx{flex:1;font-size:13px}
.sub.on .stx{text-decoration:line-through;color:var(--mute)}
.x{color:var(--mute);font-size:16px;width:24px;height:24px}
.x:hover{color:var(--rd)}
.subadd{display:flex;gap:6px;margin-top:8px}
.subadd .inp{padding:8px 10px}
.tact{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
@media(max-width:480px){.subs{padding-left:12px}}

.grp{margin-bottom:22px}
.grphd{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.grphd .cnt{font:11px var(--mono);color:var(--dim)}
.bar-accent{width:3px;height:14px}

.ov{position:fixed;inset:0;z-index:50;background:rgba(3,6,10,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@media(min-width:640px){.ov{align-items:center}}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel2);border:1px solid var(--line2);border-radius:6px 6px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.32,.72,0,1)}
@media(min-width:640px){.sheet{border-radius:6px}}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.shd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}
.fld{margin-bottom:14px;flex:1;min-width:0}
.fld>label{display:block;font:10px var(--mono);letter-spacing:.14em;color:var(--dim);margin-bottom:6px}
.inp{width:100%;background:#0A1018;border:1px solid var(--line2);color:var(--text);padding:10px 12px;border-radius:3px;font-size:16px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--cy)}
.inp::placeholder{color:var(--mute)}
textarea.inp{resize:vertical;line-height:1.5}
input[type=date]{color-scheme:dark;font-family:var(--mono);font-size:15px}
.two{display:flex;gap:10px}
.quick{display:flex;gap:4px;margin:-6px 0 14px;flex-wrap:wrap}
.err{color:var(--rd);font-size:12px;min-height:16px;margin-bottom:8px;font-family:var(--mono)}
.hint{font-size:10.5px;color:var(--mute);margin:-6px 0 14px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script>
'use strict';
const KEY='mission_planner_v1';
const DAY=864e5;
const KDAY=['일','월','화','수','목','금','토'];
const PL={H:'P1',M:'P2',L:'P3'}, PR={H:0,M:1,L:2};
const ST={
  NOMINAL:{c:'var(--gr)',k:'정상 궤도',r:2},
  AHEAD:{c:'var(--cy)',k:'순항 중',r:3},
  BEHIND:{c:'var(--am)',k:'지연',r:1},
  OVERDUE:{c:'var(--rd)',k:'기한 초과',r:0},
  STANDBY:{c:'var(--dim)',k:'발사 대기',r:4},
  COMPLETE:{c:'var(--gr)',k:'임무 완료',r:5},
  'NO DATA':{c:'var(--mute)',k:'할 일 없음',r:2}
};
const $=s=>document.querySelector(s);
const p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();d.setHours(0,0,0,0);return d}
function pd(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function fd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function diffD(a,b){return Math.round((b-a)/DAY)}
const md=s=>{const d=pd(s);return p2(d.getMonth()+1)+'.'+p2(d.getDate())};
const dot=s=>s.replace(/-/g,'.');
const pc=v=>Math.round(v*100)+'%';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function seed(){
  const T=today(),s=n=>({id:uid(),text:n[0],done:!!n[1]});
  return {seq:1,missions:[{
    id:uid(),sample:true,code:'MSN-001',name:'예시 · 캡스톤 1차 발표 준비',
    desc:'예시 미션이에요. 편집하거나 삭제하고 나만의 미션을 등록해보세요.',
    start:fd(T),end:fd(addD(T,20)),unit:'auto',tasks:[
      {id:uid(),title:'주제 선정 및 자료 조사',due:fd(addD(T,3)),pri:'H',done:false,open:true,
        subs:[s(['관련 논문 3편 찾기',1]),s(['아이디어 3개로 압축']),s(['팀 회의에서 주제 확정'])]},
      {id:uid(),title:'시스템 블록 다이어그램 작성',due:fd(addD(T,9)),pri:'M',done:false,open:false,
        subs:[s(['입출력 정의']),s(['모듈 분할']),s(['인터페이스 명세'])]},
      {id:uid(),title:'발표 슬라이드 제작',due:fd(addD(T,16)),pri:'M',done:false,open:false,subs:[]},
      {id:uid(),title:'리허설 2회',due:fd(addD(T,19)),pri:'L',done:false,open:false,subs:[]}
    ]}]};
}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&Array.isArray(v.missions))return v}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
let U={view:'list',mid:null,editing:null,tEdit:null};
const isSample=m=>m.sample||String(m.name).startsWith('예시 ·');
const M=()=>S.missions.find(m=>m.id===U.mid);
function findTask(tid){for(const m of S.missions){const t=m.tasks.find(t=>t.id===tid);if(t)return{m,t}}return{}}

const tProg=t=>t.subs.length?t.subs.filter(s=>s.done).length/t.subs.length:(t.done?1:0);
const mProg=m=>m.tasks.length?m.tasks.reduce((a,t)=>a+tProg(t),0)/m.tasks.length:0;
const taskSort=(a,b)=>a.due.localeCompare(b.due)||PR[a.pri]-PR[b.pri];
function stat(m){
  const T=today(),s=pd(m.start),e=pd(m.end),total=diffD(s,e)+1,p=mProg(m);
  const sched=T<s?0:T>e?1:(diffD(s,T)+1)/total;
  let st;
  if(m.tasks.length&&p>=1)st='COMPLETE';
  else if(T<s)st='STANDBY';
  else if(T>e)st='OVERDUE';
  else if(!m.tasks.length)st='NO DATA';
  else{const d=p-sched;st=d<-0.15?'BEHIND':d>0.1?'AHEAD':'NOMINAL'}
  return{p,sched,st,total,elapsed:Math.max(0,Math.min(total,diffD(s,T)+1)),left:diffD(T,e),toLaunch:diffD(T,s)};
}
function tLabel(s){
  if(s.st==='STANDBY')return{v:'T−'+s.toLaunch,k:'발사까지 (일)'};
  if(s.st==='COMPLETE')return{v:'DONE',k:'임무 완료'};
  if(s.left<0)return{v:'D+'+(-s.left),k:'기한 초과 (일)'};
  if(s.left===0)return{v:'D−DAY',k:'오늘 마감'};
  return{v:'D−'+s.left,k:'남은 기간 (일)'};
}
function autoUnit(m){const n=diffD(pd(m.start),pd(m.end))+1;return n<=10?'day':n<=90?'week':'month'}
const unitOf=m=>m.unit&&m.unit!=='auto'?m.unit:autoUnit(m);
function segments(m){
  const s=pd(m.start),e=pd(m.end),u=unitOf(m),out=[];
  if(u==='day'){for(let d=s;d<=e;d=addD(d,1))out.push({a:d,b:d})}
  else if(u==='week'){for(let d=s;d<=e;d=addD(d,7)){const b=addD(d,6);out.push({a:d,b:b>e?e:b})}}
  else{let d=s;while(d<=e){const b=new Date(d.getFullYear(),d.getMonth()+1,0);out.push({a:d,b:b>e?e:b});d=new Date(d.getFullYear(),d.getMonth()+1,1)}}
  const pre={day:'D',week:'W',month:'M'}[u];
  return out.map((g,i)=>({...g,label:pre+p2(i+1)}));
}

function clockStr(){const d=new Date();return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${KDAY[d.getDay()]} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`}

function vList(){

    </article>`}).join('');
  h+=`<div class="bk"><span class="lbl">DATA LINK · 기기 간 이동용</span><button class="btn sm" data-act="export">백업 내보내기</button><button class="btn sm" data-act="import">불러오기</button></div>`;

function timeline(m,s,segs){
  const st=pd(m.start),en=pd(m.end),tot=s.total,T=today();
  const pos=d=>Math.max(0,Math.min(100,(diffD(st,d)+.5)/tot*100));
  const step=Math.max(1,Math.ceil(segs.length/10));
  const ticks=segs.map((g,i)=>i%step?'':`<div class="tick ${i===0?'first':''}" style="left:${diffD(st,g.a)/tot*100}%"><span>${g.label}</span></div>`).join('');
  const el=T<st?0:T>en?100:pos(T);
  const mk=m.tasks.map(t=>{const f=tProg(t)>=1,l=!f&&pd(t.due)<T;return `<div class="mk ${f?'done':l?'late':''}" style="left:${pos(pd(t.due))}%" title="${esc(t.title)}"></div>`}).join('');
  const now=T>=st&&T<=en?`<div class="now ${pos(T)>82?'r':''}" style="left:${pos(T)}%"><span>NOW</span></div>`:'';
  return `<div class="tl"><div class="track"></div><div class="elapsed" style="width:${el}%"></div>${ticks}${mk}${now}</div>
  <div class="tlends mono"><span>LAUNCH ${dot(m.start)}</span><span>TARGET ${dot(m.end)}</span></div>
  <div class="legend mono"><span><i class="lg o"></i>예정</span><span><i class="lg g"></i>완료</span><span><i class="lg r"></i>지연</span></div>`;
}

function taskHTML(m,t,T,tag){

    <div class="trow">
      <button class="chk ${full?'on':p>0?'part':''}" data-act="toggleTask" data-tid="${t.id}" aria-label="완료 전환">${full?'✓':''}</button>

        <div class="tt">${esc(t.title)}</div>
        <div class="tm mono"><span class="pri p${t.pri}">${PL[t.pri]}</span><span>${late?'<b class="rd">OVERDUE</b>':'DUE'} ${md(t.due)} ${KDAY[pd(t.due).getDay()]}</span>${t.subs.length?`<span>SUB ${sd}/${t.subs.length}</span>`:''}</div>
        ${t.subs.length?`<div class="mini"><i style="width:${pc(p)}"></i></div>`:''}

    </div>
    ${t.open?`<div class="subs">
      ${t.subs.map((s,i)=>`<div class="sub ${s.done?'on':''}"><span class="sn mono">${p2(i+1)}</span><button class="chk s ${s.done?'on':''}" data-act="toggleSub" data-tid="${t.id}" data-sid="${s.id}">${s.done?'✓':''}</button><span class="stx">${esc(s.text)}</span><button class="x" data-act="delSub" data-tid="${t.id}" data-sid="${s.id}" aria-label="삭제">×</button></div>`).join('')}
      <div class="subadd"><input class="inp subin" data-tid="${t.id}" placeholder="세부 단계 추가 후 Enter"><button class="btn sm" data-act="addSub" data-tid="${t.id}">추가</button></div>

    </div>`:''}

function vMission(m){
  const s=stat(m),tl=tLabel(s),segs=segments(m),u=unitOf(m),T=today(),tS=fd(T);
  const done=m.tasks.filter(t=>tProg(t)>=1).length;
  const defDue=tS>=m.start&&tS<=m.end?tS:m.start;
  let h=`<div class="navrow"><button class="btn ghost sm" data-act="tab" data-v="list">◂ 미션 목록</button><span class="sp"></span><button class="btn sm" data-act="editMission">편집</button><button class="btn sm dng" data-act="delMission">삭제</button></div>
  <section class="pnl">
    <div class="mc-top"><span class="code">${esc(m.code)}</span>${chip(s.st)}</div>
    <h1 class="hero-name">${esc(m.name)}</h1>
    ${m.desc?`<p class="desc">${esc(m.desc)}</p>`:''}
    <div class="tgrid">
      <div><div class="lbl">${s.st==='STANDBY'?'COUNTDOWN':'REMAINING'}</div><div class="big or">${tl.v}</div><div class="cap">${tl.k}</div></div>
      <div><div class="lbl">PROGRESS</div><div class="big">${pc(s.p)}</div><div class="cap">진척도</div></div>
      <div><div class="lbl">ELAPSED</div><div class="big">${s.elapsed}<small>/${s.total}</small></div><div class="cap">경과 일수</div></div>
      <div><div class="lbl">TASKS</div><div class="big">${done}<small>/${m.tasks.length}</small></div><div class="cap">완료 항목</div></div>
    </div>
    <div class="bars">${barRow('SCHED',s.sched,'sch')}${barRow('PROG',s.p,'prg')}</div>
  </section>
  <section class="pnl"><div class="phd"><div><div class="lbl">FLIGHT PATH</div><h2>타임라인</h2></div></div>${timeline(m,s,segs)}</section>
  <div class="sechd"><div><div class="lbl">SEGMENT BREAKDOWN</div><h2>기간별 세부 계획</h2></div><button class="btn pri" data-act="addTask" data-date="${defDue}">+ 할 일</button></div>
  <div class="seg-ctrl"><span class="lbl">분할 단위</span>${['day','week','month'].map(k=>`<button class="seg-b ${u===k?'on':''}" data-act="unit" data-u="${k}">${{day:'일',week:'주',month:'월'}[k]}</button>`).join('')}</div>
  <div class="segs">`;
  h+=segs.map(g=>{
    const a=fd(g.a),b=fd(g.b),ts=m.tasks.filter(t=>t.due>=a&&t.due<=b).sort(taskSort);
    const cur=T>=g.a&&T<=g.b,past=g.b<T,dn=ts.filter(t=>tProg(t)>=1).length;
    const rng=a===b?`${md(a)} ${KDAY[g.a.getDay()]}`:`${md(a)} – ${md(b)}`;
    return `<section class="seg ${cur?'cur':''} ${past?'past':''}">
      <div class="seghd"><span class="segid">${g.label}</span><span class="mono sm dim">${rng}</span>${cur?'<span class="nowtag">◉ NOW</span>':''}<span class="sp"></span>${ts.length?`<span class="mono sm ${dn===ts.length?'gr':'dim'}">${dn}/${ts.length}</span>`:''}<button class="add" data-act="addTask" data-date="${cur?tS:a}" aria-label="이 구간에 할 일 추가">+</button></div>
      ${ts.length?ts.map(t=>taskHTML(m,t,T)).join(''):'<div class="emptyseg">— 비어 있음</div>'}
    </section>`}).join('');
  const out=m.tasks.filter(t=>t.due<m.start||t.due>m.end).sort(taskSort);
  if(out.length)h+=`<section class="seg"><div class="seghd"><span class="segid rd">OUT</span><span class="mono sm dim">기간 밖 항목</span></div>${out.map(t=>taskHTML(m,t,T)).join('')}</section>`;
  return h+'</div>';
}

function vToday(){
  const T=today(),tS=fd(T),wk=fd(addD(T,7)),all=[];
  S.missions.forEach(m=>m.tasks.forEach(t=>{if(tProg(t)<1)all.push({m,t})}));
  all.sort((a,b)=>taskSort(a.t,b.t));
  const od=all.filter(x=>x.t.due<tS),td=all.filter(x=>x.t.due===tS),up=all.filter(x=>x.t.due>tS&&x.t.due<=wk);
  const grp=(k,c,col,list)=>list.length?`<div class="grp"><div class="grphd"><i class="bar-accent" style="background:${col}"></i><span class="lbl" style="color:${col}">${k}</span><span>${c}</span><span class="cnt">[${list.length}]</span></div>${list.map(x=>taskHTML(x.m,x.t,T,true)).join('')}</div>`:'';
  let h=`<div class="tele4">${tele('DATE',md(tS),KDAY[T.getDay()]+'요일')}${tele('OVERDUE',od.length,'기한 초과')}${tele('T-0',td.length,'오늘 마감')}${tele('NEXT 7D',up.length,'7일 이내')}</div>
  <div class="sechd"><div><div class="lbl">OPERATIONS QUEUE</div><h2>오늘의 운용 목록</h2></div></div>`;
  if(!od.length&&!td.length&&!up.length)h+=`<div class="pnl empty"><div class="ic">ALL SYSTEMS NOMINAL</div><p>7일 안에 마감되는 할 일이 없어요.</p></div>`;
  return h+grp('OVERDUE','기한 초과','var(--rd)',od)+grp('T-0 · TODAY','오늘 마감','var(--or)',td)+grp('NEXT 7 DAYS','다가오는 7일','var(--cy)',up);
}

const ferr=msg=>{$('#f_err').textContent='⚠ '+msg};

function missionForm(m){

  U.editing=m?m.id:null;

    <div class="fld"><label>MISSION NAME · 미션 이름</label><input class="inp" id="f_name" value="${esc(e.name)}" placeholder="예: 중간고사 대비 2주 플랜" maxlength="60"></div>
    <div class="two">
      <div class="fld"><label>LAUNCH · 시작일</label><input type="date" class="inp" id="f_start" value="${e.start}"></div>
      <div class="fld"><label>TARGET · 종료일</label><input type="date" class="inp" id="f_end" value="${e.end}"></div>
    </div>
    <div class="quick"><span class="lbl" style="align-self:center;margin-right:6px">빠른 설정</span>${[7,14,30,60,90].map(n=>`<button class="seg-b" data-act="qd" data-n="${n}">${n}일</button>`).join('')}</div>
    <div class="fld"><label>SEGMENT · 기간 분할 단위</label><div class="seg-ctrl">${units.map(([k,l])=>`<button class="seg-b ${(e.unit||'auto')===k?'on':''}" data-act="pick" data-f="f_unit" data-v="${k}">${l}</button>`).join('')}</div><input type="hidden" id="f_unit" value="${e.unit||'auto'}"></div>
    <div class="fld"><label>NOTES · 메모 (선택)</label><textarea class="inp" id="f_desc" rows="2" placeholder="목표, 범위, 참고사항">${esc(e.desc||'')}</textarea></div>
    <div class="err" id="f_err"></div>
    <button class="btn pri full" data-act="saveMission">${m?'변경사항 저장':'미션 발사 🚀'}</button>`);
}
function saveMission(){
  const name=$('#f_name').value.trim(),start=$('#f_start').value,end=$('#f_end').value,unit=$('#f_unit').value,desc=$('#f_desc').value.trim();
  if(!name)return ferr('미션 이름을 입력하세요');
  if(!start||!end)return ferr('기간을 지정하세요');
  if(end<start)return ferr('종료일이 시작일보다 빠릅니다');
  if(diffD(pd(start),pd(end))>730)return ferr('기간은 최대 2년까지 가능합니다');
  if(U.editing){Object.assign(S.missions.find(m=>m.id===U.editing),{name,start,end,unit,desc})}
  else{
    S.seq=(S.seq||0)+1;
    const m={id:uid(),code:'MSN-'+String(S.seq).padStart(3,'0'),name,desc,start,end,unit,tasks:[]};
    S.missions.push(m);U.view='mission';U.mid=m.id;
  }
  save();closeModal();render();scrollTo(0,0);
}

function taskForm(t,date,m){
  U.tEdit={mid:m.id,tid:t?t.id:null};
  const e=t||{title:'',due:date,pri:'M',subs:[]};
  openModal(`<div class="shd"><div><div class="lbl">${esc(m.code)} · ${t?'MODIFY TASK':'NEW TASK'}</div><h2>${t?'할 일 수정':'할 일 추가'}</h2></div><button class="x" data-act="close" aria-label="닫기">×</button></div>
    <div class="fld"><label>TASK · 할 일</label><input class="inp" id="t_title" value="${esc(e.title)}" placeholder="예: 회로 시뮬레이션 완료" maxlength="80"></div>
    <div class="two">
      <div class="fld"><label>DUE · 마감일</label><input type="date" class="inp" id="t_due" min="${m.start}" max="${m.end}" value="${e.due}"></div>
      <div class="fld"><label>PRIORITY · 우선순위</label><div class="seg-ctrl">${['H','M','L'].map(k=>`<button class="seg-b ${e.pri===k?'on':''}" data-act="pick" data-f="t_pri" data-v="${k}">${PL[k]}</button>`).join('')}</div><input type="hidden" id="t_pri" value="${e.pri}"></div>
    </div>
    <div class="hint mono">MISSION WINDOW ${dot(m.start)} → ${dot(m.end)}</div>
    <div class="fld"><label>SUB-STEPS · 세부 단계 (한 줄에 하나씩)</label><textarea class="inp" id="t_subs" rows="5" placeholder="자료 조사&#10;초안 작성&#10;검토 및 수정">${esc(e.subs.map(s=>s.text).join('\n'))}</textarea></div>
    <div class="err" id="f_err"></div>
    <button class="btn pri full" data-act="saveTask">${t?'변경사항 저장':'할 일 등록'}</button>`);
}
function saveTask(){
  const m=S.missions.find(x=>x.id===U.tEdit.mid);if(!m)return closeModal();
  const title=$('#t_title').value.trim(),due=$('#t_due').value,pri=$('#t_pri').value;
  const lines=$('#t_subs').value.split('\n').map(x=>x.trim()).filter(Boolean);
  if(!title)return ferr('할 일을 입력하세요');
  if(!due)return ferr('마감일을 선택하세요');
  if(due<m.start||due>m.end)return ferr('미션 기간 안의 날짜를 선택하세요');
  const t=U.tEdit.tid&&m.tasks.find(x=>x.id===U.tEdit.tid);
  if(t){
    const pool=t.subs.slice();
    t.subs=lines.map(txt=>{const i=pool.findIndex(s=>s.text===txt);if(i>-1){const o=pool.splice(i,1)[0];return{id:o.id,text:txt,done:o.done}}return{id:uid(),text:txt,done:false}});
    Object.assign(t,{title,due,pri});
    if(t.subs.length)t.done=t.subs.every(s=>s.done);
  }else{
    m.tasks.push({id:uid(),title,due,pri,done:false,open:lines.length>0,subs:lines.map(x=>({id:uid(),text:x,done:false}))});
  }
  save();closeModal();render();
}

function addSub(tid){
  const inp=document.querySelector(`.subin[data-tid="${tid}"]`),v=inp&&inp.value.trim();
  if(!v)return;
  const{t}=findTask(tid);if(!t)return;
  t.subs.push({id:uid(),text:v,done:false});t.done=false;
  save();render();
  const n=document.querySelector(`.subin[data-tid="${tid}"]`);n&&n.focus();
}
function act(a,el){
  const d=el.dataset,m=M();
  switch(a){
    case'tab':U.view=d.v;U.mid=null;render();scrollTo(0,0);break;
    case'open':U.view='mission';U.mid=d.id;render();scrollTo(0,0);break;
    case'newMission':missionForm(null);break;
    case'editMission':m&&missionForm(m);break;
    case'delMission':if(m)ask('미션 삭제',`"${m.name}"\n포함된 할 일 ${m.tasks.length}개도 모두 삭제됩니다.`,'삭제',()=>{S.missions=S.missions.filter(x=>x!==m);U.view='list';U.mid=null});break;
    case'saveMission':saveMission();break;
    case'unit':if(m){m.unit=d.u;save();render()}break;
    case'qd':{const s=$('#f_start').value;if(s)$('#f_end').value=fd(addD(pd(s),+d.n-1));break}
    case'pick':$('#'+d.f).value=d.v;el.parentElement.querySelectorAll('.seg-b').forEach(b=>b.classList.toggle('on',b===el));break;
    case'addTask':m&&taskForm(null,d.date,m);break;
    case'editTask':{const r=findTask(d.tid);r.t&&taskForm(r.t,null,r.m);break}
    case'saveTask':saveTask();break;
    case'delTask':{const r=findTask(d.tid);if(r.t)ask('할 일 삭제',`"${r.t.title}"\n세부 단계 ${r.t.subs.length}개도 함께 삭제됩니다.`,'삭제',()=>{r.m.tasks=r.m.tasks.filter(x=>x!==r.t)});break}
    case'clearSample':{const sm=S.missions.filter(isSample);if(sm.length)ask('예시 삭제',`예시 미션 ${sm.length}개를 삭제합니다.`,'삭제',()=>{S.missions=S.missions.filter(x=>!isSample(x))});break}
    case'yes':{const fn=U.pending;closeModal();if(fn){fn();save();render();scrollTo(0,0)}break}
    case'toggleTask':{const{t}=findTask(d.tid);if(!t)break;
      if(t.subs.length){const v=!t.subs.every(s=>s.done);t.subs.forEach(s=>s.done=v);t.done=v}else t.done=!t.done;
      save();render();break}
    case'toggleSub':{const{t}=findTask(d.tid);const s=t&&t.subs.find(x=>x.id===d.sid);if(!s)break;s.done=!s.done;t.done=t.subs.every(x=>x.done);save();render();break}
    case'delSub':{const{t}=findTask(d.tid);if(!t)break;t.subs=t.subs.filter(x=>x.id!==d.sid);if(t.subs.length)t.done=t.subs.every(x=>x.done);save();render();break}
    case'addSub':addSub(d.tid);break;
    case'expand':{const{t}=findTask(d.tid);if(t){t.open=!t.open;save();render()}break}
    case'close':closeModal();break;
    case'export':{
      const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mission-planner-'+fd(today())+'.json';
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}
    case'import':$('#imp').click();break;
  }
}
document.addEventListener('click',e=>{
  if(e.target.id==='ov')return closeModal();
  const el=e.target.closest('[data-act]');if(el)act(el.dataset.act,el);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeModal();
  if(e.key==='Enter'&&!e.isComposing&&e.keyCode!==229&&e.target.classList.contains('subin')){e.preventDefault();addSub(e.target.dataset.tid)}
});
$('#imp').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const v=JSON.parse(r.result);if(!v||!Array.isArray(v.missions))throw 0;
    ask('백업 불러오기','현재 데이터를 백업 파일 내용으로 교체합니다.','교체',()=>{S=v;U={view:'list',mid:null,editing:null,tEdit:null}});
  }catch(err){ask('불러오기 실패','올바른 백업 파일이 아니에요.','확인',null)}e.target.value=''};
  r.readAsText(f);
});
setInterval(()=>{const c=$('#clk');if(c)c.textContent=clockStr()},1000);

(function(){try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#090D14';x.fillRect(0,0,180,180);
  x.strokeStyle='rgba(71,211,232,.12)';x.lineWidth=1;
  for(let i=0;i<=180;i+=20){x.beginPath();x.moveTo(i,0);x.lineTo(i,180);x.stroke();x.beginPath();x.moveTo(0,i);x.lineTo(180,i);x.stroke()}
  const r=-0.5;x.strokeStyle='#47D3E8';x.lineWidth=6;x.beginPath();x.ellipse(90,90,64,26,r,0,Math.PI*2);x.stroke();
  x.fillStyle='#FF6A1F';x.beginPath();x.arc(90,90,22,0,Math.PI*2);x.fill();
  const t=-1.9,px=90+64*Math.cos(t)*Math.cos(r)-26*Math.sin(t)*Math.sin(r),py=90+64*Math.cos(t)*Math.sin(r)+26*Math.sin(t)*Math.cos(r);
  x.fillStyle='#DDE6F1';x.beginPath();x.arc(px,py,8,0,Math.PI*2);x.fill();
  const u=c.toDataURL('image/png');
  ['apple-touch-icon','icon'].forEach(rel=>{const l=document.createElement('link');l.rel=rel;l.href=u;document.head.appendChild(l)});
}catch(e){}})();

render();
</script>
</body>
